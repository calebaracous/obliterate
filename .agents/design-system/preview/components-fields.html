<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .group-label { font-family: var(--font-sans); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-text-tertiary); margin-bottom: 8px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .field {
    height: 32px;
    padding: 0 12px;
    background: var(--color-bg-subtle);
    border: 1px solid var(--color-border-default);
    border-radius: 3px;
    color: var(--color-text-primary);
    font-family: var(--font-sans);
    font-size: 13px;
    min-width: 180px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .field.focus { border-color: var(--color-gold-bright); box-shadow: 0 0 0 2px rgba(201,146,42,0.2); }
  .field .placeholder { color: var(--color-text-tertiary); }
  .chev { color: var(--color-text-tertiary); margin-left: auto; }
  .search-icon { color: var(--color-text-tertiary); }
</style></head>
<body>

<div>
  <div class="group-label">Search</div>
  <div class="row">
    <div class="field" style="min-width:280px"><span class="search-icon">⌕</span><span class="placeholder">Search players, guilds, weapons…</span></div>
    <div class="field focus" style="min-width:280px"><span class="search-icon">⌕</span>Cursed Staff</div>
  </div>
</div>

<div>
  <div class="group-label">Select / dropdown</div>
  <div class="row">
    <div class="field">All regions <span class="chev">▾</span></div>
    <div class="field">Last 7 days <span class="chev">▾</span></div>
    <div class="field" style="border-color: var(--color-gold-bright); color: var(--color-gold-text)">HG 5v5 <span class="chev" style="color:var(--color-gold-text)">▾</span></div>
  </div>
</div>

<div>
  <div class="group-label">IP bracket — segmented</div>
  <div class="row">
    <div style="display:flex; border:1px solid var(--color-border-default); border-radius:3px; overflow:hidden; font-family:var(--font-sans); font-size:12px;">
      <div style="padding:6px 12px; color:var(--color-text-secondary); border-right:1px solid var(--color-border-default)">All</div>
      <div style="padding:6px 12px; color:var(--color-text-secondary); border-right:1px solid var(--color-border-default)">800–1100</div>
      <div style="padding:6px 12px; background:var(--color-gold-subtle); color:var(--color-gold-text); border-right:1px solid var(--color-border-default)">1100–1400</div>
      <div style="padding:6px 12px; color:var(--color-text-secondary)">1400+</div>
    </div>
  </div>
</div>

</body></html>
