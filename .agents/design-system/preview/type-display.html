<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; display: flex; flex-direction: column; gap: 18px; }
  .row { display: grid; grid-template-columns: 80px 1fr; align-items: baseline; gap: 16px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.08em; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-tertiary); margin-top: 2px; }
</style></head>
<body>
  <div class="row">
    <div class="lbl">Display</div>
    <div>
      <div class="t-display">Top weapons this patch</div>
      <div class="meta">Cinzel · 28/600 · 1.2 — page titles, hero stats</div>
    </div>
  </div>
  <div class="row">
    <div class="lbl">Heading</div>
    <div>
      <div class="t-heading">Matchup matrix</div>
      <div class="meta">Cinzel · 18/600 · 1.3 — section headings</div>
    </div>
  </div>
  <div class="row">
    <div class="lbl">Subhead</div>
    <div>
      <div class="t-subheading">Win rate</div>
      <div class="meta">IBM Plex Sans · 14/500 · 1.4 — card titles, table headers</div>
    </div>
  </div>
</body></html>
