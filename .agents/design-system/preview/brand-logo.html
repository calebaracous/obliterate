<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .panel { padding: 20px; border: 1px solid var(--color-border-subtle); border-radius: 4px; display: flex; align-items: center; justify-content: center; height: 140px; }
  .panel.dark { background: var(--color-bg-base); }
  .panel.surface { background: var(--color-bg-surface); }
  .panel.gold { background: var(--color-gold-bright); }
  .panel.crimson { background: var(--color-crimson-subtle); }
  .panel img { max-height: 80px; }
  .label { font-family: var(--font-mono); font-size: 9px; color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 6px; text-align: center; }
  .pair { display: flex; flex-direction: column; }
</style></head>
<body>

<div class="pair">
  <div class="panel dark"><img src="../assets/logo.svg" alt="Obliterate"></div>
  <div class="label">primary · on dark</div>
</div>
<div class="pair">
  <div class="panel surface"><img src="../assets/glyph.svg" alt="Glyph" style="height:64px"></div>
  <div class="label">glyph mark · on surface</div>
</div>
<div class="pair">
  <div class="panel gold"><img src="../assets/logo-light.svg" alt="Obliterate" style="height:60px"></div>
  <div class="label">on gold accent</div>
</div>
<div class="pair">
  <div class="panel crimson"><img src="../assets/logo.svg" alt="Obliterate" style="height:60px"></div>
  <div class="label">on crimson tint</div>
</div>

</body></html>
