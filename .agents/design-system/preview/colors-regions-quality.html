<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 16px; }
  .group { margin-bottom: 16px; }
  .group:last-child { margin-bottom: 0; }
  .group-label {
    font-family: var(--font-sans);
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--color-text-tertiary);
    margin-bottom: 8px;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    height: 28px;
    padding: 0 12px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .qchip {
    height: 36px;
    width: 36px;
    background: #1c1c1a;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--color-text-secondary);
  }
  .qrow { display: flex; gap: 12px; align-items: center; }
  .qrow > div + div { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-secondary); }
</style></head>
<body>

<div class="group">
  <div class="group-label">Region badges</div>
  <div class="row">
    <span class="pill" style="background:rgba(74,122,184,0.15); color:#7aa8e8; border:1px solid rgba(74,122,184,0.3)">● West · #4a7ab8</span>
    <span class="pill" style="background:rgba(106,154,64,0.15); color:#9ac870; border:1px solid rgba(106,154,64,0.3)">● EU · #6a9a40</span>
    <span class="pill" style="background:rgba(184,120,64,0.15); color:#e0a070; border:1px solid rgba(184,120,64,0.3)">● Asia · #b87840</span>
  </div>
</div>

<div class="group">
  <div class="group-label">Item quality borders</div>
  <div class="qrow">
    <div class="qchip" style="border:1.5px solid #b8b8ad"></div>
    <div>Normal · #b8b8ad</div>
  </div>
  <div class="qrow" style="margin-top:6px">
    <div class="qchip" style="border:1.5px solid #6dbe6d"></div>
    <div>Good · #6dbe6d</div>
  </div>
  <div class="qrow" style="margin-top:6px">
    <div class="qchip" style="border:1.5px solid #4a8acb"></div>
    <div>Outstanding · #4a8acb</div>
  </div>
  <div class="qrow" style="margin-top:6px">
    <div class="qchip" style="border:1.5px solid #e8b060"></div>
    <div>Excellent · #e8b060</div>
  </div>
  <div class="qrow" style="margin-top:6px">
    <div class="qchip" style="border:1.5px solid #d97a2a"></div>
    <div>Masterpiece · #d97a2a</div>
  </div>
</div>

</body></html>
