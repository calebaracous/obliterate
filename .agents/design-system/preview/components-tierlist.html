<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 16px; }
  .tier { display: grid; grid-template-columns: 72px 1fr; height: 64px; border: 1px solid var(--color-border-subtle); border-radius: 4px; overflow: hidden; }
  .tier + .tier { margin-top: 6px; }
  .label {
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: 0.04em;
  }
  .icons { display: flex; align-items: center; gap: 4px; padding: 0 12px; background: var(--color-bg-surface); }
  .ic { width: 40px; height: 40px; background: var(--color-bg-subtle); border: 1px solid var(--color-border-default); border-radius: 3px; }
</style></head>
<body>

<div class="tier">
  <div class="label" style="background:#2a1e06; color:#f0a020">S</div>
  <div class="icons">
    <div class="ic" style="border-color:#d97a2a"></div>
    <div class="ic" style="border-color:#e8b060"></div>
    <div class="ic" style="border-color:#e8b060"></div>
    <div class="ic" style="border-color:#4a8acb"></div>
    <div class="ic" style="border-color:#6dbe6d"></div>
    <div class="ic"></div>
  </div>
</div>

<div class="tier">
  <div class="label" style="background:#1e2a06; color:#90c040">A</div>
  <div class="icons">
    <div class="ic" style="border-color:#e8b060"></div>
    <div class="ic" style="border-color:#4a8acb"></div>
    <div class="ic" style="border-color:#4a8acb"></div>
    <div class="ic" style="border-color:#6dbe6d"></div>
    <div class="ic" style="border-color:#6dbe6d"></div>
    <div class="ic"></div>
    <div class="ic"></div>
  </div>
</div>

<div class="tier">
  <div class="label" style="background:#062028; color:#40a0c0">B</div>
  <div class="icons">
    <div class="ic" style="border-color:#4a8acb"></div>
    <div class="ic" style="border-color:#6dbe6d"></div>
    <div class="ic"></div>
    <div class="ic"></div>
    <div class="ic"></div>
  </div>
</div>

</body></html>
