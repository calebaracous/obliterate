<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .group-label { font-family: var(--font-sans); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-text-tertiary); margin-bottom: 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill {
    height: 22px;
    padding: 0 10px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border: 1px solid transparent;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
</style></head>
<body>

<div>
  <div class="group-label">Region</div>
  <div class="row">
    <span class="pill" style="background:rgba(74,122,184,0.12); color:#7aa8e8; border-color:rgba(74,122,184,0.3)"><span class="dot" style="background:#4a7ab8"></span>West</span>
    <span class="pill" style="background:rgba(106,154,64,0.12); color:#9ac870; border-color:rgba(106,154,64,0.3)"><span class="dot" style="background:#6a9a40"></span>EU</span>
    <span class="pill" style="background:rgba(184,120,64,0.12); color:#e0a070; border-color:rgba(184,120,64,0.3)"><span class="dot" style="background:#b87840"></span>Asia</span>
  </div>
</div>

<div>
  <div class="group-label">Content type</div>
  <div class="row">
    <span class="pill" style="background:#222220; color:#9a9890">Solo</span>
    <span class="pill" style="background:rgba(140,80,180,0.12); color:#c090e0">Corrupted</span>
    <span class="pill" style="background:rgba(64,180,180,0.12); color:#70d0d0">Mists 1v1</span>
    <span class="pill" style="background:rgba(64,180,180,0.12); color:#70d0d0">Mists 2v2</span>
    <span class="pill" style="background:rgba(201,146,42,0.12); color:#e8b060">HG 2v2</span>
    <span class="pill" style="background:rgba(240,160,32,0.18); color:#f0c060">HG 5v5</span>
    <span class="pill" style="background:rgba(74,122,184,0.12); color:#7aa8e8">Small scale</span>
    <span class="pill" style="background:rgba(184,50,50,0.15); color:#e06060">ZvZ</span>
    <span class="pill" style="background:rgba(217,122,42,0.15); color:#e8a060">Gank</span>
    <span class="pill" style="background:#1c1c1a; color:#5c5b55; font-style:italic">~Unknown</span>
  </div>
</div>

<div>
  <div class="group-label">Status</div>
  <div class="row">
    <span class="pill" style="background:rgba(58,122,58,0.12); color:#6dbe6d; border-color:rgba(58,122,58,0.3)"><span class="dot" style="background:#3a7a3a"></span>Live</span>
    <span class="pill" style="background:rgba(232,176,96,0.12); color:#e8b060; border-color:rgba(232,176,96,0.3)"><span class="dot" style="background:#e8b060"></span>Stale 4m</span>
    <span class="pill" style="background:rgba(184,50,50,0.15); color:#e06060; border-color:rgba(184,50,50,0.3)"><span class="dot" style="background:#b83232"></span>API down</span>
  </div>
</div>

</body></html>
