<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .bar {
    display: flex; align-items: center; gap: 18px;
    padding: 10px 16px;
    background: var(--color-bg-surface);
    border: 1px solid var(--color-border-subtle);
    border-radius: 4px;
  }
  .item { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px; color: var(--color-text-secondary); }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.green { background: #6dbe6d; box-shadow: 0 0 6px rgba(109,190,109,0.6); }
  .dot.amber { background: #e8b060; }
  .dot.red   { background: #e06060; }
  .label { font-family: var(--font-sans); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-text-tertiary); margin-right: 4px; }
  .age.fresh { color: var(--color-win-text); }
  .age.stale { color: var(--color-gold-text); }
  .age.down  { color: var(--color-crimson-text); }
</style></head>
<body>

<div class="bar">
  <span class="label">Freshness</span>
  <div class="item"><span class="dot green"></span>West <span class="age fresh">47s</span></div>
  <div class="item"><span class="dot green"></span>EU <span class="age fresh">52s</span></div>
  <div class="item"><span class="dot amber"></span>Asia <span class="age stale">4m 12s</span></div>
</div>

<div class="bar">
  <span class="label">Freshness</span>
  <div class="item"><span class="dot green"></span>West <span class="age fresh">31s</span></div>
  <div class="item"><span class="dot red"></span>EU <span class="age down">API down · last 8m</span></div>
  <div class="item"><span class="dot green"></span>Asia <span class="age fresh">1m 02s</span></div>
</div>

</body></html>
