<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .group-label { font-family: var(--font-sans); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-text-tertiary); margin-bottom: 8px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn {
    height: 32px;
    padding: 0 14px;
    border-radius: 3px;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    border: 1px solid transparent;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 150ms cubic-bezier(.2,0,0,1), border-color 150ms;
  }
  .btn-primary { background: var(--color-gold-bright); color: var(--color-text-inverse); }
  .btn-primary.hover { background: var(--color-gold-muted); }
  .btn-primary.active { box-shadow: inset 0 0 0 1px rgba(201,146,42,0.4); filter: brightness(0.92); }
  .btn-ghost { background: transparent; color: var(--color-text-primary); border-color: var(--color-border-default); }
  .btn-ghost.hover { background: var(--color-bg-elevated); border-color: var(--color-border-strong); }
  .btn-danger { background: transparent; color: var(--color-crimson-text); border-color: rgba(184,50,50,0.4); }
  .btn-danger.hover { background: var(--color-crimson-subtle); }
  .btn[disabled], .btn.disabled { opacity: 0.4; cursor: not-allowed; }
  .lbl-under { font-family: var(--font-mono); font-size: 9px; color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; text-align: center; }
  .col { display: flex; flex-direction: column; align-items: stretch; }
</style></head>
<body>

<div>
  <div class="group-label">Primary · gold</div>
  <div class="row">
    <div class="col"><button class="btn btn-primary">Apply filter</button><div class="lbl-under">default</div></div>
    <div class="col"><button class="btn btn-primary hover">Apply filter</button><div class="lbl-under">hover</div></div>
    <div class="col"><button class="btn btn-primary active">Apply filter</button><div class="lbl-under">active</div></div>
    <div class="col"><button class="btn btn-primary disabled">Apply filter</button><div class="lbl-under">disabled</div></div>
  </div>
</div>

<div>
  <div class="group-label">Ghost · default</div>
  <div class="row">
    <div class="col"><button class="btn btn-ghost">Reset</button><div class="lbl-under">default</div></div>
    <div class="col"><button class="btn btn-ghost hover">Reset</button><div class="lbl-under">hover</div></div>
    <div class="col"><button class="btn btn-ghost disabled">Reset</button><div class="lbl-under">disabled</div></div>
  </div>
</div>

<div>
  <div class="group-label">Danger · crimson</div>
  <div class="row">
    <div class="col"><button class="btn btn-danger">Delete</button><div class="lbl-under">default</div></div>
    <div class="col"><button class="btn btn-danger hover">Delete</button><div class="lbl-under">hover</div></div>
  </div>
</div>

</body></html>
